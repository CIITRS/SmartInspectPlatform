name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huawei-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: huawei-go/go.mod
          cache-dependency-path: huawei-go/go.sum
      - run: go test ./...
      - run: go vet ./...

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: huawei-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: huawei-ui/package-lock.json
      - run: npm ci
      - run: npm run build

